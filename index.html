
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOAQO — Living Collage</title>

<style>
:root {
  --paper: #f3f3f0;
  --ink: #111;
  --red: #d92027;
  --blue: #1676c7;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--paper);
  font-family: Arial, Helvetica, sans-serif;
}

body { overflow-x: hidden; }

.stage {
  width: 100%;
  height: 100svh;
  min-height: 500px;
  position: relative;
  overflow: hidden;
  background: var(--paper);
}

/* GRID LAYOUT */

.collage {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: var(--cols, 20% 18% 22% 20% 20%);
  grid-template-rows: var(--rows, 18% 24% 20% 20% 18%);
  gap: 0;
  transition:
    grid-template-columns 1800ms cubic-bezier(.45,0,.2,1),
    grid-template-rows 1800ms cubic-bezier(.45,0,.2,1);
}

/* IMAGE TILES */

.tile {
  position: relative;
  overflow: hidden;
  min-width: 0;
  min-height: 0;
  background: var(--paper);
  isolation: isolate;
}

.tile img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.035);
  transition: transform 2400ms ease;
  display: block;
}

.tile.mono img {
  filter: grayscale(1) contrast(1.18);
}

.tile.cyan img {
  filter: saturate(1.35) hue-rotate(8deg) contrast(1.08);
}

.tile.blue img {
  filter: saturate(1.45) contrast(1.12);
}

.tile:hover img {
  transform: scale(1.075);
}

/* PIXELATED TRANSITION LAYER */

.pixel-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0;
  image-rendering: pixelated;
}

.tile.glitching .pixel-layer {
  opacity: 1;
}

/* WHITE BLOCK MASK */

.block-mask {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

.block {
  position: absolute;
  background: var(--paper);
  opacity: 0;
  transform: scaleX(0);
  transform-origin: left;
}

.tile.glitching .block {
  animation: blockFlash var(--duration, 900ms)
    steps(2, end) both;
  animation-delay: var(--delay, 0ms);
}

@keyframes blockFlash {
  0%   { opacity: 0; transform: scaleX(0); }
  20%  { opacity: 1; transform: scaleX(1); }
  65%  { opacity: 1; transform: scaleX(1); }
  100% { opacity: 0; transform: scaleX(0); }
}

/* STATIC RIGHT PANEL */

.fixed-panel {
  position: absolute;
  right: 0;
  top: 0;
  width: clamp(160px, 19vw, 330px);
  height: 100%;
  z-index: 20;
  pointer-events: none;
  display: flex;
  justify-content: flex-end;
  align-items: flex-start;
}

.panel-content {
  margin-top: 9vh;
  width: 100%;
  padding: 28px 24px;
  background: var(--paper);
  border-left: 1px solid #1112;
  pointer-events: auto;
}

.panel-eyebrow {
  font: 11px monospace;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

.panel-title {
  font-size: clamp(35px, 5vw, 78px);
  line-height: .9;
  font-weight: 900;
  letter-spacing: -4px;
  margin: 0;
}

.panel-title span {
  display: block;
}

.panel-rule {
  height: 2px;
  background: #111;
  margin: 25px 0;
}

.panel-meta {
  font: 11px/1.8 monospace;
  letter-spacing: 1px;
}

.panel-bottom {
  margin-top: 40px;
  font: 10px monospace;
  opacity: .55;
}

/* STATIC BRAND MARK */

.brand {
  position: absolute;
  top: 5%;
  left: 3%;
  z-index: 30;
  background: var(--paper);
  padding: 12px 18px;
  font-weight: 900;
  font-size: 26px;
  letter-spacing: -1.5px;
}

.brand small {
  display: block;
  margin-top: 5px;
  font: 9px monospace;
  letter-spacing: 2px;
}

/* SMALL EDITORIAL MARKERS */

.corner-index {
  position: absolute;
  left: 3%;
  bottom: 4%;
  z-index: 15;
  background: var(--paper);
  padding: 9px 12px;
  font: 10px monospace;
  letter-spacing: 1px;
}

/* MOBILE */

@media (max-width: 700px) {
  .fixed-panel {
    width: 145px;
  }

  .panel-content {
    margin-top: 12vh;
    padding: 15px 12px;
  }

  .panel-title {
    font-size: 36px;
    letter-spacing: -2px;
  }

  .panel-meta { font-size: 9px; }

  .brand {
    font-size: 21px;
    padding: 9px 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .collage,
  .tile img {
    transition: none;
  }
}
</style>
</head>

<body>

<main class="stage">

  <div class="collage" id="collage"></div>

  <div class="brand">
    Joaqo®
    <small>VIDEO EDITOR</small>
  </div>

  <aside class="fixed-panel">
    <div class="panel-content">
      <div class="panel-eyebrow">VISUAL / 001</div>

      <h1 class="panel-title">
        <span>JO</span>
        <span>AQ</span>
        <span>O.</span>
      </h1>

      <div class="panel-rule"></div>

      <div class="panel-meta">
        PHOTOGRAPHIC<br>
        RECONSTRUCTION<br>
        EXPERIMENT<br><br>
        AUTOMATED COLLAGE<br>
        SYSTEM / 2026
      </div>

      <div class="panel-bottom">
        IN CONTINUOUS MOTION
      </div>
    </div>
  </aside>

  <div class="corner-index">
    JOAQO / IMAGE SYSTEM — 001
  </div>

</main>

<script>
"use strict";

/* ========================================
   IMAGE LIBRARY
======================================== */

const PHOTO_URLS = [
  // Urban / monochrome
  "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=1600",
  "https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=1600",

  // Architecture / city
  "https://images.unsplash.com/photo-1514565131-fce0801e5785?w=1600",
  "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1600",

  // Color / atmosphere
  "https://images.unsplash.com/photo-1494522358652-f30e61d6a23a?w=1600",
  "https://images.unsplash.com/photo-1514905552197-0610a4d8fd73?w=1600",

  // Additional city imagery
  "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1600",
  "https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1600",
  "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1600",
  "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=1600"
];

const loadedImages = PHOTO_URLS.map(src => {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = src;
  return img;
});

/* ========================================
   CONFIGURATION
======================================== */

const CONFIG = {
  tileCount: 15,
  minSwapDelay: 450,
  maxSwapDelay: 1900,
  glitchDuration: 950,
  gridChangeInterval: 4800,
  pixelResolution: 14
};

const collage = document.getElementById("collage");
const tiles = [];

const rand = (min,max) =>
  min + Math.random() * (max-min);

const randomInt = (min,max) =>
  Math.floor(rand(min,max+1));

const choose = arr =>
  arr[Math.floor(Math.random()*arr.length)];

const sleep = ms =>
  new Promise(resolve => setTimeout(resolve,ms));

function validImages() {
  return loadedImages.filter(
    img => img.complete && img.naturalWidth > 0
  );
}

/* ========================================
   GRID DEFINITIONS
======================================== */

// Each layout uses the same 5x5 logical grid.
// Tiles span different rows and columns.
//
// Changing CSS grid track sizes produces
// smooth structural resizing without
// moving any image outside its container.

const AREAS = [
  [1,1,3,2],
  [1,3,2,4],
  [1,5,2,2],
  [3,3,2,2],
  [3,5,2,2],
  [3,1,2,2],
  [5,1,1,2],
  [5,3,1,2],
  [5,5,1,1]
];

// Fill remaining positions with
// small tiles if needed.

const EXTRA_AREAS = [
  [2,5,1,1],
  [2,4,1,1],
  [4,4,1,1],
  [4,5,1,1],
  [5,4,1,1],
  [1,4,1,1]
];

/* ========================================
   TILE CREATION
======================================== */

function makeTile(index, area) {
  const el = document.createElement("div");
  el.className = "tile";

  const [row,col,rowSpan,colSpan] = area;

  el.style.gridRow =
    `${row} / span ${rowSpan}`;

  el.style.gridColumn =
    `${col} / span ${colSpan}`;

  const img = document.createElement("img");
  img.alt = "";
  img.decoding = "async";

  const available = validImages();
  if(available.length) {
    img.src = choose(available).src;
  }

  el.appendChild(img);

  const pixelCanvas = document.createElement("canvas");
  pixelCanvas.className = "pixel-layer";
  el.appendChild(pixelCanvas);

  const mask = document.createElement("div");
  mask.className = "block-mask";
  el.appendChild(mask);

  const styles = ["mono","cyan","blue",""];
  el.classList.add(choose(styles));

  collage.appendChild(el);

  const tile = {
    el,
    img,
    pixelCanvas,
    mask,
    busy:false,
    index
  };

  createBlocks(tile);
  tiles.push(tile);
}

/* ========================================
   WHITE BLOCK MASK
======================================== */

function createBlocks(tile) {
  tile.mask.innerHTML = "";

  const count = randomInt(9,22);

  for(let i=0;i<count;i++) {
    const block = document.createElement("span");
    block.className = "block";

    const w = rand(8,42);
    const h = rand(6,28);

    block.style.left = rand(0,100-w)+"%";
    block.style.top = rand(0,100-h)+"%";
    block.style.width = w+"%";
    block.style.height = h+"%";

    block.style.setProperty(
      "--delay",
      randomInt(0,380)+"ms"
    );

    block.style.setProperty(
      "--duration",
      randomInt(500,950)+"ms"
    );

    tile.mask.appendChild(block);
  }
}

/* ========================================
   PIXELATION RENDERER
======================================== */

// Draws a low-resolution copy of the
// current image, then scales it back up.
//
// This is real image pixelation, not
// simply a CSS blur filter.

function drawPixelated(tile, resolution) {
  const {pixelCanvas,img,el} = tile;

  if(!img.complete || !img.naturalWidth) return;

  const rect = el.getBoundingClientRect();

  const w = Math.max(1,Math.floor(rect.width));
  const h = Math.max(1,Math.floor(rect.height));

  const smallW = Math.max(1,Math.floor(w/resolution));
  const smallH = Math.max(1,Math.floor(h/resolution));

  const temp = document.createElement("canvas");
  temp.width = smallW;
  temp.height = smallH;

  const tctx = temp.getContext("2d");

  const scale = Math.max(
    smallW/img.naturalWidth,
    smallH/img.naturalHeight
  );

  const dw = img.naturalWidth*scale;
  const dh = img.naturalHeight*scale;

  tctx.drawImage(
    img,
    (smallW-dw)/2,
    (smallH-dh)/2,
    dw,dh
  );

  pixelCanvas.width = w;
  pixelCanvas.height = h;

  const pctx = pixelCanvas.getContext("2d");
  pctx.imageSmoothingEnabled = false;

  pctx.clearRect(0,0,w,h);
  pctx.drawImage(temp,0,0,w,h);
}

/* ========================================
   IMAGE SWAP
======================================== */

async function swapTile(tile) {
  if(tile.busy) return;

  const available = validImages();
  if(available.length < 2) return;

  tile.busy = true;

  const oldSrc = tile.img.src;

  const candidates = available.filter(
    img => img.src !== oldSrc
  );

  const nextImage = choose(candidates);

  // Phase 1:
  // Pixelate existing photograph.
  drawPixelated(tile,CONFIG.pixelResolution);

  tile.el.classList.add("glitching");

  createBlocks(tile);

  await sleep(280);

  // Phase 2:
  // Change the underlying photograph
  // while the pixel layer hides the swap.
  tile.img.src = nextImage.src;

  const styles = ["mono","cyan","blue",""];

  tile.el.classList.remove(
    "mono","cyan","blue"
  );

  const style = choose(styles);
  if(style) tile.el.classList.add(style);

  await sleep(260);

  // Phase 3:
  // Pixelated new photograph.
  drawPixelated(tile,8);

  await sleep(210);

  // Phase 4:
  // Resolve into sharp photograph.
  tile.el.classList.remove("glitching");

  await sleep(200);

  tile.busy = false;
}

/* ========================================
   AUTOMATIC TILE LOOP
======================================== */

let running = true;

async function tileLoop(tile) {
  while(running) {
    await sleep(rand(
      CONFIG.minSwapDelay,
      CONFIG.maxSwapDelay
    ));

    if(document.hidden) continue;

    await swapTile(tile);
  }
}

/* ========================================
   GRID RESIZING
======================================== */

const GRID_STATES = [
  {
    cols:[20,18,22,20,20],
    rows:[18,24,20,20,18]
  },
  {
    cols:[14,25,17,27,17],
    rows:[25,14,26,15,20]
  },
  {
    cols:[27,12,25,16,20],
    rows:[15,28,14,27,16]
  },
  {
    cols:[18,24,14,19,25],
    rows:[22,16,27,14,21]
  },
  {
    cols:[24,16,21,23,16],
    rows:[17,22,19,26,16]
  }
];

let gridState = 0;

function applyGrid(state) {
  collage.style.setProperty(
    "--cols",
    state.cols.map(v=>v+"fr").join(" ")
  );

  collage.style.setProperty(
    "--rows",
    state.rows.map(v=>v+"fr").join(" ")
  );
}

function changeGrid() {
  gridState = (gridState+1)%GRID_STATES.length;
  applyGrid(GRID_STATES[gridState]);
}

/* ========================================
   INITIALIZATION
======================================== */

function init() {
  const areas = [...AREAS,...EXTRA_AREAS];

  areas.slice(0,CONFIG.tileCount).forEach(
    (area,i)=>makeTile(i,area)
  );

  applyGrid(GRID_STATES[0]);

  tiles.forEach(tile => tileLoop(tile));

  setInterval(()=>{
    if(!document.hidden) changeGrid();
  },CONFIG.gridChangeInterval);
}

window.addEventListener("load",init);

</script>
</body>
</html>
