
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Joaqo — Collage Animation Test</title>
<style>
* { box-sizing:border-box; }
body { margin:0; background:#f2f1ed; font-family:monospace; }
canvas { display:block; width:100%; height:100vh; }

.panel {
  position:fixed;
  left:20px;
  bottom:20px;
  z-index:10;
  background:#111;
  color:white;
  padding:18px;
  width:250px;
  font-size:12px;
}
.panel label {
  display:flex;
  justify-content:space-between;
  margin:12px 0 5px;
}
.panel input { width:100%; accent-color:#e92832; }
.panel button {
  background:white;
  color:black;
  border:0;
  padding:8px 12px;
  margin-top:10px;
  cursor:pointer;
}
.note {
  position:fixed;
  left:20px;
  top:20px;
  font-size:11px;
  background:#f2f1ed;
  padding:10px;
  z-index:5;
}
@media(max-width:600px) {
  .panel { width:200px; padding:12px; }
}
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="note">JOAQO / PHOTOGRAPHIC FRAGMENTATION TEST 03</div>

<div class="panel">
  <strong>ANIMATION CONTROLS</strong>

  <label>Activity <span id="activityValue">5</span></label>
  <input id="activity" type="range" min="1" max="10" value="5">

  <label>Fragmentation <span id="fragmentValue">6</span></label>
  <input id="fragment" type="range" min="1" max="10" value="6">

  <label>Transition speed <span id="speedValue">5</span></label>
  <input id="speed" type="range" min="1" max="10" value="5">

  <button id="pause">PAUSE</button>
  <button id="reset">REBUILD</button>
</div>

<script>
const canvas=document.getElementById("stage");
const ctx=canvas.getContext("2d");

const settings={
  activity:5,
  fragmentation:6,
  speed:5
};

for(const [id,key] of [
  ["activity","activity"],
  ["fragment","fragmentation"],
  ["speed","speed"]
]){
  const input=document.getElementById(id);
  const output=document.getElementById(id+"Value");

  input.oninput=()=>{
    settings[key]=Number(input.value);
    output.textContent=input.value;
  };
}

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{
  x=clamp(x);
  return x*x*(3-2*x);
};

// Replace these image addresses with local
// photographs for your final portfolio.
const urls=[
  "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=1400",
  "https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=1400",
  "https://images.unsplash.com/photo-1514565131-fce0801e5785?w=1400",
  "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1400",
  "https://images.unsplash.com/photo-1494522358652-f30e61d6a23a?w=1400",
  "https://images.unsplash.com/photo-1514905552197-0610a4d8fd73?w=1400"
];

const images=urls.map(url=>{
  const img=new Image();
  img.src=url;
  return img;
});

let W,H,DPR;
let regions=[];
let paused=false;
let last=0;
let clock=0;

const paper="#f2f1ed";

function makeRegion(x,y,w,h,imageIndex){
  return {
    x,y,w,h,
    current:imageIndex,
    next:imageIndex,
    cells:[],
    elapsed:0,
    duration:1500,
    transitioning:false,
    wait:rand(300,2200),
    zoom:1,
    zoomDirection:1
  };
}

function createRegions(){
  regions=[
    makeRegion(.53,-.03,.49,.49,0),
    makeRegion(.79,.35,.23,.32,1),
    makeRegion(.55,.44,.31,.35,2),
    makeRegion(.00,.66,.43,.36,3),
    makeRegion(.40,.70,.34,.32,4),
    makeRegion(.73,.72,.29,.31,5)
  ];

  for(const r of regions) generateCells(r);
}

function generateCells(r){
  r.cells=[];

  const rw=r.w*W;
  const rh=r.h*H;

  const base=Math.max(
    18,
    95-settings.fragmentation*7
  );

  for(let y=0;y<rh;y+=base){
    for(let x=0;x<rw;x+=base){
      const fine=Math.random()<.38;
      const parts=fine
        ? (Math.random()<.5?3:5)
        : 1;

      const cw=Math.min(base,rw-x);
      const ch=Math.min(base,rh-y);

      for(let j=0;j<parts;j++){
        for(let i=0;i<parts;i++){
          const px=x+cw*i/parts;
          const py=y+ch*j/parts;

          r.cells.push({
            x:px,
            y:py,
            w:cw/parts,
            h:ch/parts,
            delay:rand(0,.65),
            duration:rand(.25,.5),
            axis:Math.random()<.5?"x":"y",
            direction:Math.random()<.5?-1:1,
            distance:rand(4,40),
            vanish:Math.random()<.22,
            pixel:Math.random()<.6
          });
        }
      }
    }
  }
}

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  createRegions();
}

function chooseImage(except){
  const available=images
    .map((img,i)=>img.complete&&img.naturalWidth?i:-1)
    .filter(i=>i>=0&&i!==except);

  if(!available.length) return except;
  return available[Math.floor(Math.random()*available.length)];
}

function begin(r){
  r.next=chooseImage(r.current);
  if(r.next===r.current) {
    r.wait=500;
    return;
  }

  r.elapsed=0;
  r.duration=rand(1100,2400)*
    (1.6-settings.speed*.1);

  r.transitioning=true;
  generateCells(r);
}

function update(dt){
  clock+=dt;

  for(const r of regions){
    if(r.transitioning){
      r.elapsed+=dt;

      if(r.elapsed>=r.duration){
        r.current=r.next;
        r.transitioning=false;
        r.wait=rand(400,2600)*
          (1.6-settings.activity*.13);
      }
    } else {
      r.wait-=dt;
      if(r.wait<=0) begin(r);
    }

    // Slow continuous breathing zoom.
    r.zoom+=r.zoomDirection*dt*.000008;
    if(r.zoom>1.08) r.zoomDirection=-1;
    if(r.zoom<1.0) r.zoomDirection=1;
  }
}

// Image drawing uses the same image coordinates
// across all cells in a region. This preserves
// photographic continuity.

function drawImagePart(img,r,c,dx,dy,alpha,pixel){
  if(!img.complete||!img.naturalWidth||alpha<=0) return;

  const rx=r.x*W;
  const ry=r.y*H;
  const rw=r.w*W;
  const rh=r.h*H;

  const scale=Math.max(
    rw/img.naturalWidth,
    rh/img.naturalHeight
  )*r.zoom;

  const imageW=img.naturalWidth*scale;
  const imageH=img.naturalHeight*scale;

  const offsetX=(rw-imageW)/2;
  const offsetY=(rh-imageH)/2;

  const cx=rx+c.x;
  const cy=ry+c.y;

  ctx.save();
  ctx.globalAlpha=alpha;

  ctx.beginPath();
  ctx.rect(cx+dx,cy+dy,c.w+.3,c.h+.3);
  ctx.clip();

  if(pixel){
    // Quantized sampling gives a mosaic-like
    // appearance without creating canvases
    // during every animation frame.
    const block=12;
    const sx=Math.floor(c.x/block)*block;
    const sy=Math.floor(c.y/block)*block;

    const sourceX=(sx-offsetX)/scale;
    const sourceY=(sy-offsetY)/scale;

    const sampleX=Math.max(0,Math.min(
      img.naturalWidth-1,sourceX
    ));
    const sampleY=Math.max(0,Math.min(
      img.naturalHeight-1,sourceY
    ));

    const sw=Math.max(1,Math.min(
      img.naturalWidth-sampleX,
      block/scale
    ));

    const sh=Math.max(1,Math.min(
      img.naturalHeight-sampleY,
      block/scale
    ));

    // Enlarged source samples.
    ctx.imageSmoothingEnabled=false;

    ctx.drawImage(
      img,
      sampleX,sampleY,sw,sh,
      cx+dx,cy+dy,
      Math.max(c.w,block),
      Math.max(c.h,block)
    );
  } else {
    ctx.drawImage(
      img,
      rx+offsetX+dx,
      ry+offsetY+dy,
      imageW,imageH
    );
  }

  ctx.restore();
}

function renderRegion(r){
  const current=images[r.current];
  const next=images[r.next];

  const t=r.transitioning
    ?clamp(r.elapsed/r.duration)
    :0;

  for(const c of r.cells){
    const cx=r.x*W+c.x;
    const cy=r.y*H+c.y;

    // Protect the top-left interface area.
    // No photography is drawn over it.
    if(cx<W*.18&&cy<H*.47) continue;

    if(!r.transitioning){
      drawImagePart(current,r,c,0,0,1,false);
      continue;
    }

    const local=ease(
      (t-c.delay)/c.duration
    );

    const movement=Math.sin(local*Math.PI)*
      c.distance*c.direction;

    const dx=c.axis==="x"?movement:0;
    const dy=c.axis==="y"?movement:0;

    const middle=Math.sin(local*Math.PI);
    const pixel=c.pixel&&middle>.45;

    const gap=c.vanish
      ?1-middle*.95
      :1;

    // White interruptions are visible because
    // the underlying canvas is paper-colored.
    drawImagePart(
      current,r,c,dx,dy,
      (1-local)*gap,pixel
    );

    drawImagePart(
      next,r,c,dx,dy,
      local*gap,pixel
    );
  }
}

function drawGrain(){
  ctx.save();

  for(let i=0;i<75;i++){
    ctx.fillStyle=Math.random()<.5
      ?"rgba(0,0,0,.10)"
      :"rgba(255,255,255,.14)";

    ctx.fillRect(
      rand(0,W),
      rand(0,H),
      rand(1,3),
      rand(1,3)
    );
  }

  ctx.restore();
}

function frame(time){
  requestAnimationFrame(frame);

  const dt=Math.min(time-last,50)||0;
  last=time;

  if(!paused) update(dt);

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=paper;
  ctx.fillRect(0,0,W,H);

  // Later regions are layered over earlier ones.
  for(const r of regions) renderRegion(r);

  if(!paused) drawGrain();
}

document.getElementById("pause").onclick=()=>{
  paused=!paused;
  document.getElementById("pause").textContent=
    paused?"PLAY":"PAUSE";
};

document.getElementById("reset").onclick=()=>{
  createRegions();
};

resize();
addEventListener("resize",resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
