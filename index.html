<style>
* { box-sizing:border-box; }

html { scroll-behavior:smooth; }

body {
  margin:0;
  background:#f4f3f0;
  color:#111;
  font-family:"DM Mono",monospace;
}

a { color:inherit;text-decoration:none; }

button { font:inherit;cursor:pointer; }

.hero {
  position:relative;
  height:100svh;
  min-height:650px;
  overflow:hidden;
  isolation:isolate;
  background:#f4f3f0;
}

.hero::before {
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(#00000008 1px,transparent 1px),
    linear-gradient(90deg,#00000008 1px,transparent 1px);
  background-size:21px 21px;
  z-index:-1;
}

#visual {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
}

.interface {
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

.interface a,
.interface button { pointer-events:auto; }

.header {
  position:absolute;
  top:6%;
  left:4%;
  right:4%;
  display:flex;
  justify-content:space-between;
}

.identity {
  display:flex;
  align-items:center;
  gap:18px;
}

.logo {
  font:bold 30px Arial,sans-serif;
  letter-spacing:-2px;
}

.logo sup {
  font-size:10px;

}

.social {
  font:bold 19px Arial,sans-serif;
  display:flex;
  gap:15px;
}

.subtitle {
  margin-top:9px;
  font-size:10px;
  letter-spacing:2px;
}

.languages {
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.languages button {
  border:0;
  background:transparent;
  padding:4px;
  font-size:12px;
}

.languages .selected {
  border-bottom:2px solid #111;
}

.navigation {
  position:absolute;
  top:23%;
  left:4%;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.navigation a {
  display:flex;
  align-items:center;
  gap:12px;
  font-size:11px;
}

.navigation .item {
  min-width:145px;
  display:flex;
  justify-content:space-between;
  padding:9px 13px;
  font:bold 16px Arial,sans-serif;
}

.navigation a:first-child .item,
.navigation a:hover .item {
  background:#111;

}

.wordmark {
  position:absolute;
  left:18%;
  top:35%;
  display:flex;
  align-items:center;
  transform:rotate(-4deg);
  filter:drop-shadow(8px 10px 0 #0002);
  pointer-events:none;
}

.letter {
  font-size:clamp(75px,11vw,190px);
  line-height:1;
  padding:0 .055em;
  color:white;
  background:#111;
  display:block;
  position:relative;
}

.letter:nth-child(1) {
  font-family:Anton,sans-serif;
  transform:rotate(-8deg) translateY(9px);
}

.letter:nth-child(2) {
  font-family:"Playfair Display",serif;
  background:#e9262c;
  color:#111;
  transform:rotate(7deg) translateY(-12px);
}

.letter:nth-child(3) {
  font-family:"UnifrakturCook",serif;
  background:#eee;
  color:#111;
  transform:rotate(-5deg) translateY(10px);
}

.letter:nth-child(4) {
  font-family:Anton,sans-serif;
  transform:rotate(5deg) translateY(-8px);
}

.letter:nth-child(5) {
  font-family:"Playfair Display",serif;
  background:#1547d5;
  transform:rotate(-8deg) translateY(10px);
}

.footer-line {
  position:absolute;
  bottom:4%;
  left:7%;
  width:30%;
  border-top:1px solid #777;
}

.content {
  padding:100px 8%;
  min-height:45vh;
}

.content h2 {
  font:80px Anton,sans-serif;
  margin:0 0 20px;
}

.content p {
  max-width:620px;
  line-height:1.8;
}

@media(max-width:700px) {
  .hero { min-height:720px; }

  .wordmark {
    left:7%;
    top:49%;
  }

  .letter { font-size:17vw; }

  .navigation { top:21%; }

  .navigation .item { min-width:125px; }

  .content h2 { font-size:55px; }
}

@media(prefers-reduced-motion:reduce) {
  html { scroll-behavior:auto; }
}
</style>
</head>

<body>

<section class="hero" id="home">
  <canvas id="visual"></canvas>

  <div class="interface">
    <header class="header">
      <div>
        <div class="identity">
          <a href="#home" class="logo">Joaqo<sup>©</sup></a>
          <div class="social">
            <a href="#" aria-label="Instagram">◎</a>
            <a href="#" aria-label="X">𝕏</a>
          </div>
        </div>
        <div class="subtitle">VIDEO EDITOR</div>
      </div>

      <div class="languages">
        <button id="es">ES</button>
        <span>/</span>
        <button id="en" class="selected">EN</button>
      </div>
    </header>

    <nav class="navigation">
      <a href="#home">
        01
        <span class="item">
          <span data-en="HOME" data-es="INICIO">HOME</span> →
        </span>
      </a>
      <a href="#work">
        02
        <span class="item">
          <span data-en="WORK" data-es="TRABAJOS">WORK</span> →
        </span>
      </a>
      <a href="#about">
        03
        <span class="item">
          <span data-en="ABOUT" data-es="SOBRE MÍ">ABOUT</span> →
        </span>
      </a>
      <a href="#contact">
        04
        <span class="item">
          <span data-en="CONTACT" data-es="CONTACTO">CONTACT</span> →
        </span>
      </a>
    </nav>

    <h1 class="wordmark" aria-label="Joaqo">
      <span class="letter">J</span>
      <span class="letter">o</span>
      <span class="letter">a</span>
      <span class="letter">q</span>
      <span class="letter">o</span>
    </h1>

    <div class="footer-line"></div>
  </div>
</section>

<section id="work" class="content">
  <h2 data-en="WORK" data-es="TRABAJOS">WORK</h2>
  <p>Selected editing projects coming soon.</p>
</section>

<section id="about" class="content">
  <h2 data-en="ABOUT" data-es="SOBRE MÍ">ABOUT</h2>
  <p>Joaqo — Video editor specializing in cinematic storytelling.</p>
</section>

<section id="contact" class="content">
  <h2 data-en="CONTACT" data-es="CONTACTO">CONTACT</h2>
  <a href="mailto:hello@example.com">hello@example.com</a>
</section>

<script>
// ===========================================
// 01. LANGUAGE
// ===========================================

const es = document.getElementById("es");
const en = document.getElementById("en");

function language(lang) {
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-en]").forEach(el => {
    el.textContent = el.dataset[lang];
  });

  es.classList.toggle("selected",lang==="es");
  en.classList.toggle("selected",lang==="en");
}

es.onclick = () => language("es");
en.onclick = () => language("en");


// ===========================================
// 02. PHOTOGRAPHIC SOURCES
// ===========================================

// Replace these with your own city photographs.
// Images are loaded once and reused.

const sources = [
  "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1600",
  "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=1600",
  "https://images.unsplash.com/photo-1514565131-fce0801e5785?w=1600",
  "https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=1600",
  "https://images.unsplash.com/photo-1494522358652-f30e61d6a23a?w=1600",
  "https://images.unsplash.com/photo-1514905552197-0610a4d8fd73?w=1600"
];

const images = sources.map(url => {
  const image = new Image();
  image.crossOrigin = "anonymous";
  image.src = url;
  return image;
});


// ===========================================
// 03. CANVAS SETUP
// ===========================================

const canvas = document.getElementById("visual");
const ctx = canvas.getContext("2d");

let W=0,H=0;
let scenes=[];
let currentScene=0;
let nextScene=1;
let pieces=[];
let transitionStart=0;

const HOLD=3000;
const TRANSITION=2200;
const TOTAL=HOLD+TRANSITION;

const reducedMotion=window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

const random=(a,b)=>a+Math.random()*(b-a);
const clamp=x=>Math.max(0,Math.min(1,x));
const smooth=x=>{
  x=clamp(x);
  return x*x*(3-2*x);
};

function resize() {
  const dpr=Math.min(devicePixelRatio||1,2);

  W=canvas.clientWidth;
  H=canvas.clientHeight;

  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);

  buildScenes();
  buildPieces();
}

window.addEventListener("resize",resize);


// ===========================================
// 04. PHOTOGRAPHIC SCENES
// ===========================================

// Each scene is one complete offscreen image.
// This is important: fragments are sampled
// from aligned compositions rather than
// independently positioned photographs.

function createBuffer() {
  const c=document.createElement("canvas");
  c.width=Math.ceil(W);
  c.height=Math.ceil(H);
  return c;
}

function cover(g,img,x,y,w,h,zoom=1) {
  if(!img.complete || !img.naturalWidth) return;

  const iw=img.naturalWidth;
  const ih=img.naturalHeight;

  const scale=Math.max(w/iw,h/ih)*zoom;
  const dw=iw*scale;
  const dh=ih*scale;

  g.drawImage(
    img,
    x+(w-dw)/2,
    y+(h-dh)/2,
    dw,dh
  );
}

function photo(g,index,x,y,w,h,zoom=1) {
  const img=images[index%images.length];

  g.save();
  g.beginPath();
  g.rect(x,y,w,h);
  g.clip();

  cover(g,img,x,y,w,h,zoom);

  g.restore();
}

function buildScenes() {
  scenes=[];

  // Four deliberately different layouts.
  const layouts=[
    [
      [0,.51,-.05,.51,.55],
      [1,.67,.42,.36,.42],
      [2,.00,.67,.49,.34],
      [3,.40,.70,.38,.34]
    ],
    [
      [3,.52,-.03,.48,.45],
      [4,.60,.35,.42,.45],
      [1,.00,.68,.48,.33],
      [5,.39,.65,.39,.36]
    ],
    [
      [2,.54,-.04,.47,.55],
      [0,.72,.48,.30,.48],
      [4,.00,.68,.53,.34],
      [1,.46,.64,.35,.36]
    ],
    [
      [5,.55,-.04,.46,.51],
      [3,.64,.43,.40,.41],
      [0,.00,.69,.50,.32],
      [2,.43,.68,.37,.33]
    ]
  ];

  layouts.forEach((layout,sceneIndex)=>{
    const buffer=createBuffer();
    const g=buffer.getContext("2d");

    g.clearRect(0,0,W,H);

    layout.forEach(([id,x,y,w,h],i)=>{
      photo(
        g,id,
        x*W,y*H,w*W,h*H,
        1.03+(sceneIndex+i)*.015
      );
    });

    // Add a few smaller photographic regions.
    for(let i=0;i<12;i++){
      const x=random(.45,1)*W;
      const y=random(.08,.94)*H;
      const w=random(15,100);
      const h=random(12,90);

      photo(g,sceneIndex+i,x,y,w,h);
    }

    scenes.push(buffer);
  });
}


// ===========================================
// 05. IRREGULAR FRAGMENT MAP
// ===========================================

// Fragment sizes vary substantially.
// A coarse grid defines the overall structure,
// while smaller fragments subdivide selected
// cells to create pixel-like regions.

function buildPieces() {
  pieces=[];

  const base=70;

  for(let y=0;y<H;y+=base){
    for(let x=0;x<W;x+=base){

      // Finer fragmentation toward the edges
      // of the photographic regions.
      const small=Math.random()<.35;

      const divisions=small
        ? (Math.random()<.5 ? 4 : 7)
        : 1;

      const sw=base/divisions;

      for(let yy=0;yy<divisions;yy++){
        for(let xx=0;xx<divisions;xx++){
          const px=x+xx*sw;
          const py=y+yy*sw;

          pieces.push({
            x:px,
            y:py,
            w:Math.min(sw,W-px),
            h:Math.min(sw,H-py),

            delay:random(0,.58),
            speed:random(.32,.58),

            axis:Math.random()<.5?"x":"y",
            direction:Math.random()<.5?-1:1,

            shift:random(8,65),
            pixel:Math.random()<.55,

            // Some fragments temporarily vanish.
            vanish:Math.random()<.18
          });
        }
      }
    }
  }
}


// ===========================================
// 06. PIXELATION CACHE
// ===========================================

// Low-resolution copies are prepared once
// per scene, not every animation frame.

let lowRes=[];

function buildLowRes() {
  lowRes=scenes.map(scene=>{
    const c=document.createElement("canvas");

    c.width=Math.max(1,Math.ceil(W/15));
    c.height=Math.max(1,Math.ceil(H/15));

    c.getContext("2d").drawImage(
      scene,0,0,c.width,c.height
    );

    return c;
  });
}


// ===========================================
// 07. DRAW FRAGMENTS
// ===========================================

function drawPiece(source,p,dx=0,dy=0,alpha=1) {
  if(alpha<=0) return;

  ctx.save();
  ctx.globalAlpha=alpha;

  ctx.drawImage(
    source,
    p.x,p.y,p.w,p.h,
    p.x+dx,p.y+dy,p.w,p.h
  );

  ctx.restore();
}

function drawPixelPiece(source,p,dx,dy,alpha) {
  if(alpha<=0) return;

  ctx.save();

  ctx.globalAlpha=alpha;
  ctx.imageSmoothingEnabled=false;

  const sx=p.x/W*source.width;
  const sy=p.y/H*source.height;
  const sw=p.w/W*source.width;
  const sh=p.h/H*source.height;

  ctx.drawImage(
    source,
    sx,sy,
    Math.max(.01,sw),
    Math.max(.01,sh),
    p.x+dx,p.y+dy,p.w,p.h
  );

  ctx.restore();
}

function transitionPiece(p,progress) {
  // Each fragment has an independent
  // time window within the transition.

  const local=clamp(
    (progress-p.delay)/p.speed
  );

  const t=smooth(local);

  const motion=Math.sin(t*Math.PI)*p.shift;

  let dx=0,dy=0;

  if(p.axis==="x") dx=motion*p.direction;
  else dy=motion*p.direction;

  // At the transition midpoint, fragments
  // can become pixelated or disappear.
  const pixelStrength=Math.sin(t*Math.PI);

  const gap=p.vanish
    ? Math.max(0,1-pixelStrength*.95)
    : 1;

  const oldAlpha=(1-t)*gap;
  const newAlpha=t*gap;

  const usePixel=p.pixel && pixelStrength>.35;

  const oldSource=usePixel
    ? lowRes[currentScene]
    : scenes[currentScene];

  const newSource=usePixel
    ? lowRes[nextScene]
    : scenes[nextScene];

  if(usePixel){
    drawPixelPiece(
      oldSource,p,dx,dy,oldAlpha
    );

    drawPixelPiece(
      newSource,p,dx,dy,newAlpha
    );
  } else {
    drawPiece(oldSource,p,dx,dy,oldAlpha);
    drawPiece(newSource,p,dx,dy,newAlpha);
  }
}


// ===========================================
// 08. RENDERING
// ===========================================

function render(time) {
  requestAnimationFrame(render);

  if(!scenes.length) return;

  ctx.clearRect(0,0,W,H);

  if(reducedMotion) {
    ctx.drawImage(scenes[0],0,0);
    return;
  }

  const elapsed=time-transitionStart;

  if(elapsed>=TOTAL){
    currentScene=nextScene;
    nextScene=(nextScene+1)%scenes.length;
    transitionStart=time;

    // A new fragmentation pattern each cycle.
    buildPieces();
  }

  const phase=time-transitionStart;

  if(phase<HOLD){
    ctx.drawImage(scenes[currentScene],0,0);
  } else {
    const progress=clamp(
      (phase-HOLD)/TRANSITION
    );

    pieces.forEach(p=>{
      transitionPiece(p,progress);
    });
  }

  // Fine intermittent digital grain.
  // Kept subtle so photographs remain visible.
  ctx.save();

  for(let i=0;i<85;i++){
    const x=random(0,W);
    const y=random(0,H);

    ctx.fillStyle=Math.random()<.5
      ?"rgba(0,0,0,.07)"
      :"rgba(255,255,255,.10)";

    ctx.fillRect(x,y,random(1,3),random(1,3));
  }

  ctx.restore();
}


// ===========================================
// 09. START
// ===========================================

async function initialize() {
  await Promise.all(
    images.map(img=>{
      if(img.complete) return Promise.resolve();

      return new Promise(resolve=>{
        img.onload=resolve;
        img.onerror=resolve;
      });
    })
  );

  resize();
  buildLowRes();

  transitionStart=performance.now();
  requestAnimationFrame(render);
}

initialize();

window.addEventListener("resize",()=>{
  buildLowRes();
  transitionStart=performance.now();
});
</script>

</body>
</html>
